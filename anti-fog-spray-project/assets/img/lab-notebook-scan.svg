<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffefb"/>
      <stop offset="100%" stop-color="#f7f3e8"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Clean Paper Sheet -->
  <rect x="15" y="15" width="570" height="720" rx="10" fill="url(#pageBg)" stroke="#e2ded4" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Left Margin Line (Red) -->
  <line x1="85" y1="15" x2="85" y2="735" stroke="#fca5a5" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Subtle notebook guide lines -->
  <g stroke="#e2e8f0" stroke-width="1" stroke-opacity="0.6">
    <line x1="85" y1="70" x2="560" y2="70"/>
    <line x1="85" y1="110" x2="560" y2="110"/>
    <line x1="85" y1="150" x2="560" y2="150"/>
    <line x1="85" y1="220" x2="560" y2="220"/>
    <line x1="85" y1="290" x2="560" y2="290"/>
    <line x1="85" y1="360" x2="560" y2="360"/>
    <line x1="85" y1="430" x2="560" y2="430"/>
    <line x1="85" y1="500" x2="560" y2="500"/>
    <line x1="85" y1="580" x2="560" y2="580"/>
    <line x1="85" y1="650" x2="560" y2="650"/>
  </g>

  <!-- Header -->
  <g font-family="'Inter', sans-serif">
    <text x="105" y="50" font-size="12" font-weight="700" fill="#16382b" letter-spacing="0.5">LAB NOTEBOOK • EXP #01</text>
    <text x="440" y="50" font-size="11" font-weight="600" fill="#64748b">100 mL BATCH</text>
    <text x="105" y="92" font-size="18" font-weight="800" fill="#16382b">FogZero Flowchart</text>
    <text x="105" y="125" font-size="11" font-weight="600" fill="#2d6a4f">Team: Yadnesh S. (01) • Harshal B. (02) • Aditya B. (03)</text>
  </g>

  <!-- Flowchart Steps (Clean Centered Boxes with Clear Arrows) -->
  <g font-family="'Inter', sans-serif" text-anchor="middle">
    
    <!-- Step 1 -->
    <g transform="translate(320, 160)">
      <rect x="-190" y="0" width="380" height="42" rx="8" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
      <text x="0" y="26" font-size="13" font-weight="700" fill="#16382b">Step 1: Clean Beaker &amp; Workspace</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 320 202 L 320 220" stroke="#2d6a4f" stroke-width="2"/>
    <polygon points="320,225 315,217 325,217" fill="#2d6a4f"/>

    <!-- Step 2 -->
    <g transform="translate(320, 228)">
      <rect x="-190" y="0" width="380" height="42" rx="8" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
      <text x="0" y="26" font-size="13" font-weight="700" fill="#16382b">Step 2: Add 80 mL Distilled Water</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 320 270 L 320 288" stroke="#2d6a4f" stroke-width="2"/>
    <polygon points="320,293 315,285 325,285" fill="#2d6a4f"/>

    <!-- Step 3 -->
    <g transform="translate(320, 296)">
      <rect x="-190" y="0" width="380" height="42" rx="8" fill="#e8f5e9" stroke="#1b4332" stroke-width="2"/>
      <text x="0" y="26" font-size="13" font-weight="800" fill="#1b4332">Step 3: Add 0.5 mL Polysorbate 80 (Stir gently)</text>
    </g>

    <!-- Arrow 3 -->
    <path d="M 320 338 L 320 356" stroke="#2d6a4f" stroke-width="2"/>
    <polygon points="320,361 315,353 325,353" fill="#2d6a4f"/>

    <!-- Step 4 -->
    <g transform="translate(320, 364)">
      <rect x="-190" y="0" width="380" height="42" rx="8" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
      <text x="0" y="26" font-size="13" font-weight="700" fill="#16382b">Step 4: Add 1.0 mL Glycerin (Mix 2 mins)</text>
    </g>

    <!-- Arrow 4 -->
    <path d="M 320 406 L 320 424" stroke="#2d6a4f" stroke-width="2"/>
    <polygon points="320,429 315,421 325,421" fill="#2d6a4f"/>

    <!-- Step 5 -->
    <g transform="translate(320, 432)">
      <rect x="-190" y="0" width="380" height="42" rx="8" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
      <text x="0" y="26" font-size="13" font-weight="700" fill="#16382b">Step 5: Top Up with Water to 100 mL</text>
    </g>

    <!-- Arrow 5 -->
    <path d="M 320 474 L 320 492" stroke="#2d6a4f" stroke-width="2"/>
    <polygon points="320,497 315,489 325,489" fill="#2d6a4f"/>

    <!-- Result Box -->
    <g transform="translate(320, 502)">
      <rect x="-190" y="0" width="380" height="48" rx="8" fill="#16382b" stroke="#16382b" stroke-width="2"/>
      <text x="0" y="30" font-size="14" font-weight="800" fill="#ffffff">✓ RESULT: 100% Clear Anti-Fog Spray</text>
    </g>
  </g>

  <!-- Observations Box -->
  <g transform="translate(105, 575)" font-family="'Inter', sans-serif">
    <rect x="0" y="0" width="455" height="100" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="16" y="24" font-size="12" font-weight="800" fill="#16382b">Key Observations:</text>
    <text x="16" y="46" font-size="11" fill="#475569">• Color: 100% Water-clear (zero cloudiness)</text>
    <text x="16" y="66" font-size="11" fill="#475569">• Steam Test: Untreated glass fogged; treated glass stayed clear</text>
    <text x="16" y="86" font-size="11" font-weight="700" fill="#10b981">• Result: Passed across all 3 trials</text>
  </g>

  <!-- Verified Stamp -->
  <g transform="translate(410, 680)" font-family="'Inter', sans-serif">
    <rect x="0" y="0" width="145" height="34" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="72" y="22" font-size="11" font-weight="800" fill="#047857" text-anchor="middle">✓ LAB VERIFIED</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLab2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="liquidBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bgLab2)"/>
  
  <!-- Countertop -->
  <rect x="0" y="380" width="600" height="70" fill="#070c18"/>
  <line x1="0" y1="380" x2="600" y2="380" stroke="#0ea5e9" stroke-width="2" opacity="0.3"/>

  <!-- Left: Glycerin Syringe / Dispenser (1.0 mL) -->
  <g transform="translate(90, 80)">
    <!-- Syringe barrel -->
    <rect x="20" y="40" width="30" height="150" rx="3" fill="#ffffff" fill-opacity="0.15" stroke="#94a3b8" stroke-width="2"/>
    <!-- Syringe plunger -->
    <rect x="30" y="0" width="10" height="70" fill="#cbd5e1"/>
    <rect x="15" y="0" width="40" height="8" rx="2" fill="#64748b"/>
    <rect x="22" y="70" width="26" height="15" rx="2" fill="#0284c7"/>
    <!-- Graduations -->
    <g stroke="#ffffff" stroke-width="1" opacity="0.8">
      <line x1="20" y1="90" x2="35" y2="90"/>
      <line x1="20" y1="110" x2="32" y2="110"/>
      <line x1="20" y1="130" x2="35" y2="130"/>
      <line x1="20" y1="150" x2="32" y2="150"/>
      <line x1="20" y1="170" x2="35" y2="170"/>
    </g>
    <!-- Liquid inside syringe (1.0 mL viscous Glycerin) -->
    <rect x="22" y="85" width="26" height="103" fill="#a855f7" opacity="0.5"/>
    <!-- Needle / Tip -->
    <rect x="32" y="190" width="6" height="35" fill="#94a3b8"/>
    
    <!-- Droplet forming at needle tip -->
    <circle cx="35" cy="235" r="4" fill="#a855f7"/>

    <!-- Syringe Label -->
    <rect x="-60" y="110" width="70" height="26" rx="4" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="-25" y="127" font-family="monospace" font-size="11" font-weight="900" fill="#c084fc" text-anchor="middle">1.0 mL</text>
    <text x="35" y="260" font-family="sans-serif" font-size="9" fill="#c084fc" text-anchor="middle">Glycerin 98%</text>
  </g>

  <!-- Center Beaker with Glass Stirrer Rod -->
  <g transform="translate(260, 150)">
    <!-- Beaker Glass Outline -->
    <rect x="0" y="30" width="160" height="200" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#94a3b8" stroke-width="2.5"/>
    
    <!-- Liquid in beaker -->
    <rect x="3" y="100" width="154" height="126" rx="8" fill="url(#liquidBlue)"/>
    
    <!-- Stirring Vortex lines -->
    <ellipse cx="80" cy="115" rx="50" ry="12" fill="none" stroke="#e0f2fe" stroke-width="2" opacity="0.6"/>
    <ellipse cx="80" cy="135" rx="35" ry="8" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.4"/>
    <ellipse cx="80" cy="155" rx="20" ry="5" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.3"/>

    <!-- Glass Stirring Rod at an angle -->
    <line x1="20" y1="-40" x2="80" y2="190" stroke="#f8fafc" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
    <line x1="22" y1="-40" x2="82" y2="190" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

    <!-- Stirring Motion Direction Arrow -->
    <path d="M 125 105 A 45 10 0 1 1 50 108" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2"/>
    <polygon points="46,110 54,103 54,115" fill="#38bdf8"/>

    <!-- Beaker Graduations -->
    <g stroke="#ffffff" stroke-width="1.5" opacity="0.7" font-family="sans-serif" font-size="9" fill="#ffffff">
      <line x1="12" y1="80" x2="30" y2="80"/><text x="35" y="83">120ml</text>
      <line x1="12" y1="120" x2="35" y2="120"/><text x="40" y="123">100ml Mark</text>
      <line x1="12" y1="160" x2="30" y2="160"/><text x="35" y="163">60ml</text>
    </g>
  </g>

  <!-- Side Technical Callout -->
  <g transform="translate(450, 160)">
    <rect x="0" y="0" width="130" height="130" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="12" y="24" font-family="sans-serif" font-size="11" font-weight="900" fill="#c084fc">HOMOGENIZATION</text>
    <text x="12" y="44" font-family="sans-serif" font-size="9" fill="#94a3b8">• Add 1 mL Glycerin</text>
    <text x="12" y="62" font-family="sans-serif" font-size="9" fill="#94a3b8">• Stir gently for 2–3 m</text>
    <text x="12" y="80" font-family="sans-serif" font-size="9" fill="#94a3b8">• Prevent cavitation</text>
    <text x="12" y="98" font-family="sans-serif" font-size="9" fill="#94a3b8">• Viscous dispersion</text>
    <text x="12" y="118" font-family="sans-serif" font-size="8" font-weight="bold" fill="#10b981">Zero Foaming Achieved</text>
  </g>
</svg>
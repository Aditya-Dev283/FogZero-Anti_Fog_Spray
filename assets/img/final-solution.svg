<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLab3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080e1a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="mistGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="450" fill="url(#bgLab3)"/>

  <!-- Pedestal Base -->
  <ellipse cx="250" cy="380" rx="160" ry="25" fill="#0369a1" opacity="0.2" filter="url(#mistGlow)"/>
  <rect x="0" y="380" width="600" height="70" fill="#050a14"/>
  <line x1="0" y1="380" x2="600" y2="380" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>

  <!-- Spray Atomizer Mist Cone -->
  <g transform="translate(145, 90)">
    <path d="M 0 10 L -130 -30 L -140 60 Z" fill="#38bdf8" opacity="0.18" filter="url(#mistGlow)"/>
    <!-- Individual mist droplet dots -->
    <g fill="#e0f2fe" opacity="0.7">
      <circle cx="-30" cy="8" r="1.5"/><circle cx="-50" cy="2" r="1.2"/><circle cx="-70" cy="15" r="1.8"/>
      <circle cx="-90" cy="-5" r="1.4"/><circle cx="-110" cy="25" r="1.6"/><circle cx="-120" cy="5" r="2"/>
      <circle cx="-40" cy="18" r="1"/><circle cx="-85" cy="35" r="1.3"/><circle cx="-135" cy="-15" r="1.5"/>
    </g>
    <text x="-90" y="80" font-family="sans-serif" font-size="9" font-weight="bold" fill="#38bdf8">Ultra-fine Atomized Mist</text>
  </g>

  <!-- Prototype Spray Bottle (100 mL) -->
  <g transform="translate(180, 80)">
    <!-- Atomizer Pump Head -->
    <path d="M 30 20 L -30 20 L -35 25 L -35 32 L -30 35 L 30 35 Z" fill="#334155" stroke="#64748b"/>
    <rect x="-5" y="0" width="30" height="20" rx="3" fill="#475569" stroke="#94a3b8"/>
    <!-- Nozzle orifice -->
    <circle cx="-32" cy="28" r="2.5" fill="#38bdf8"/>
    <rect x="-10" y="35" width="40" height="15" fill="#1e293b" stroke="#64748b"/>

    <!-- Bottle Neck -->
    <rect x="-5" y="50" width="30" height="15" fill="#64748b"/>

    <!-- Main Cylindrical Bottle (100 mL PET / Glass) -->
    <rect x="-40" y="65" width="100" height="230" rx="15" fill="url(#bottleGrad)" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Dip Tube -->
    <line x1="10" y1="35" x2="5" y2="285" stroke="#ffffff" stroke-width="3" opacity="0.5"/>

    <!-- Formulation Liquid level (100 mL Full) -->
    <rect x="-37" y="90" width="94" height="200" rx="12" fill="#0284c7" opacity="0.35"/>
    <path d="M -37 90 Q 10 95 57 90" stroke="#e0f2fe" stroke-width="2" fill="none"/>

    <!-- Professional Bottle Label -->
    <rect x="-34" y="115" width="88" height="145" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="-34" y="115" width="88" height="24" rx="6" fill="#0284c7"/>
    <text x="10" y="131" font-family="sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">CLARIVUE™</text>
    <text x="10" y="148" font-family="sans-serif" font-size="7" font-weight="bold" fill="#38bdf8" text-anchor="middle">ANTI-FOG FORMULATION</text>
    <line x1="-25" y1="154" x2="45" y2="154" stroke="#334155"/>
    <text x="-25" y="168" font-family="sans-serif" font-size="6.5" fill="#94a3b8">• Polysorbate 80: 0.5%</text>
    <text x="-25" y="180" font-family="sans-serif" font-size="6.5" fill="#94a3b8">• Glycerin: 1.0%</text>
    <text x="-25" y="192" font-family="sans-serif" font-size="6.5" fill="#94a3b8">• Distilled Water: 98.5%</text>
    <rect x="-25" y="202" width="70" height="15" rx="3" fill="#10b981" fill-opacity="0.2" stroke="#10b981"/>
    <text x="10" y="213" font-family="sans-serif" font-size="7" font-weight="bold" fill="#10b981" text-anchor="middle">LAB PROTOTYPE • 100 mL</text>
    <text x="10" y="248" font-family="sans-serif" font-size="6" fill="#64748b" text-anchor="middle">EXP BATCH #04 • OCT 2026</text>
  </g>

  <!-- Right Side Specification & Quality Seal Card -->
  <g transform="translate(350, 100)">
    <rect x="0" y="0" width="210" height="230" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="15" y="15" width="95" height="20" rx="4" fill="#0284c7"/>
    <text x="62" y="29" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">FINAL PROTOTYPE</text>
    <text x="15" y="55" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Batch Stability Pass</text>
    
    <g transform="translate(15, 75)" font-family="sans-serif" font-size="10" fill="#94a3b8">
      <text y="0"><tspan fill="#38bdf8" font-weight="bold">Phase:</tspan> 100% Homogeneous Solution</text>
      <text y="22"><tspan fill="#38bdf8" font-weight="bold">Turbidity:</tspan> 0 NTU (Crystal Clear)</text>
      <text y="44"><tspan fill="#38bdf8" font-weight="bold">Viscosity:</tspan> 1.08 cP @ 25°C</text>
      <text y="66"><tspan fill="#38bdf8" font-weight="bold">Residue Test:</tspan> Zero Visible Smear</text>
      <text y="88"><tspan fill="#38bdf8" font-weight="bold">Standing Period:</tspan> 30 Mins Confirmed</text>
    </g>

    <rect x="15" y="180" width="180" height="34" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981"/>
    <text x="105" y="202" font-family="sans-serif" font-size="11" font-weight="bold" fill="#10b981" text-anchor="middle">✓ Ready for Steam Validation</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glowLab" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Lab Bench -->
  <rect width="600" height="450" fill="url(#bgLab)"/>
  
  <!-- Subtle laboratory grid in background -->
  <g stroke="#334155" stroke-width="0.75" opacity="0.3">
    <line x1="0" y1="75" x2="600" y2="75"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="225" x2="600" y2="225"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
  </g>

  <!-- Lab Bench Countertop Surface -->
  <rect x="0" y="370" width="600" height="80" fill="#0b1120"/>
  <line x1="0" y1="370" x2="600" y2="370" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>

  <!-- Left: Reagent Bottle (Polysorbate 80) -->
  <g transform="translate(80, 210)">
    <!-- Amber Bottle Body -->
    <rect x="0" y="35" width="85" height="125" rx="10" fill="url(#amberGrad)" stroke="#78350f" stroke-width="2"/>
    <rect x="25" y="10" width="35" height="25" fill="#92400e"/>
    <!-- Bottle Cap -->
    <rect x="20" y="0" width="45" height="15" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <!-- Label -->
    <rect x="10" y="55" width="65" height="75" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="18" y="75" font-family="sans-serif" font-size="8" font-weight="900" fill="#0f172a">TWEEN 80</text>
    <text x="18" y="88" font-family="sans-serif" font-size="7" fill="#475569">Polysorbate</text>
    <text x="18" y="100" font-family="sans-serif" font-size="7" fill="#0284c7">Non-ionic</text>
    <rect x="18" y="108" width="50" height="2" fill="#d97706"/>
    <text x="18" y="120" font-family="sans-serif" font-size="6" fill="#64748b">HLB 15.0</text>
  </g>

  <!-- Center: Borosil Beaker (150 mL) with Water & Surfactant -->
  <g transform="translate(240, 160)">
    <!-- Beaker Glass Outline -->
    <path d="M 10 30 L 10 200 Q 10 210 25 210 L 125 210 Q 140 210 140 200 L 140 30 L 150 25 L 140 25 L 0 25 Z" 
          fill="url(#glassGrad)" stroke="#94a3b8" stroke-width="2.5"/>
    
    <!-- Liquid contents (80 mL distilled water + 0.5 mL Polysorbate 80) -->
    <path d="M 12 110 Q 75 116 138 110 L 138 200 Q 138 208 125 208 L 25 208 Q 12 208 12 200 Z" 
          fill="url(#liquidGrad)" opacity="0.85"/>
    
    <!-- Meniscus curved top line -->
    <path d="M 12 110 Q 75 116 138 110" fill="none" stroke="#e0f2fe" stroke-width="2.5" opacity="0.9"/>

    <!-- Graduations on beaker -->
    <g stroke="#ffffff" stroke-width="1.5" opacity="0.75" font-family="sans-serif" font-size="9" fill="#ffffff">
      <line x1="20" y1="70" x2="40" y2="70"/><text x="45" y="73">120ml</text>
      <line x1="20" y1="100" x2="40" y2="100"/><text x="45" y="103">100ml</text>
      <line x1="20" y1="130" x2="45" y2="130"/><text x="50" y="133">80ml</text>
      <line x1="20" y1="160" x2="40" y2="160"/><text x="45" y="163">50ml</text>
    </g>

    <!-- Lab Specimen Text on Beaker -->
    <text x="65" y="180" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" opacity="0.9" text-anchor="middle">BOROSIL® 150mL</text>

    <!-- Swirl particles showing dissolution -->
    <circle cx="75" cy="140" r="3" fill="#ffffff" opacity="0.7"/>
    <circle cx="95" cy="155" r="2" fill="#ffffff" opacity="0.5"/>
    <circle cx="55" cy="165" r="2.5" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Right: Precision Micropipette / Dispenser adding 0.5 mL droplet -->
  <g transform="translate(305, 30)">
    <!-- Micropipette shaft -->
    <rect x="0" y="0" width="16" height="85" fill="#3b82f6" rx="2" stroke="#1d4ed8"/>
    <rect x="3" y="85" width="10" height="40" fill="#94a3b8"/>
    <!-- Clear disposable tip -->
    <polygon points="3,125 13,125 9,180 7,180" fill="#e2e8f0" stroke="#cbd5e1" opacity="0.9"/>
    
    <!-- Liquid in tip (0.5 mL) -->
    <polygon points="4,145 12,145 9,180 7,180" fill="#f59e0b" opacity="0.9"/>

    <!-- Falling micro-droplet -->
    <ellipse cx="8" cy="205" rx="3.5" ry="5" fill="#f59e0b" filter="url(#glowLab)"/>
    <path d="M 8 198 L 11 205 Q 8 208 5 205 Z" fill="#f59e0b"/>

    <!-- Digital Volume Display badge -->
    <rect x="-85" y="30" width="75" height="28" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="-48" y="48" font-family="monospace" font-size="12" font-weight="900" fill="#38bdf8" text-anchor="middle">0.50 mL</text>
  </g>

  <!-- Overlaid Information Card -->
  <g transform="translate(420, 90)">
    <rect x="0" y="0" width="160" height="120" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.95"/>
    <rect x="10" y="10" width="70" height="18" rx="3" fill="#0284c7"/>
    <text x="45" y="22" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">STEP 02 &amp; 03</text>
    <text x="12" y="45" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Surfactant Dosing</text>
    <text x="12" y="62" font-family="sans-serif" font-size="9" fill="#94a3b8">• 80 mL Distilled Water</text>
    <text x="12" y="76" font-family="sans-serif" font-size="9" fill="#94a3b8">• 0.5 mL Polysorbate 80</text>
    <text x="12" y="90" font-family="sans-serif" font-size="9" fill="#94a3b8">• Gentle vortex stirring</text>
    <text x="12" y="104" font-family="sans-serif" font-size="8" fill="#38bdf8" font-weight="bold">Zero Frothing Speed</text>
  </g>
</svg>